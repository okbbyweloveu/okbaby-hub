<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKBABY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portada">
    <header>
        <h1>OKBABY</h1>
        <h2>Artist / Music / Community</h2>
        <a href="hub.html" class="btn">ENTER THE HUB →</a>
    </header>

    <script>
        document.querySelector('.btn').addEventListener('click', function(e) {
            e.preventDefault();
            const link = this.href;
            document.body.classList.add('fade-out');
            setTimeout(function() {
                window.location = link;
            }, 500);
        });
    </script>
</body>
</html>
